[package]
name = "ark_oracle"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
publish = false

# Independent (arkworks-rs) oracle for bn254 EIP-197 pairing KAT generation.
# Used by ../gen_pairing_kat.go to cross-verify the gnark-crypto bn254 outputs
# against arkworks before KAT vectors are emitted to the C++ test header. If
# the two oracles disagree on any pair encoding or pairing predicate, KAT
# generation aborts. (Red O2/O4.)

[dependencies]
ark-bn254 = { version = "0.5", default-features = false, features = ["curve"] }
ark-ec = { version = "0.5", default-features = false }
ark-ff = { version = "0.5", default-features = false }
ark-serialize = { version = "0.5", default-features = false }

[[bin]]
name = "ark_oracle"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = false
codegen-units = 1
