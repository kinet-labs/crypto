[package]
name = "ark_oracle"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
publish = false

# Independent (arkworks-rs) oracle for Banderwagon Fp and Fr field arithmetic.
# Used by ../gen_fp_kat.go and ../gen_fr_kat.go to cross-verify the gnark-crypto
# outputs before KAT vectors are emitted to the C++ test headers. If the two
# oracles disagree on any input, KAT generation aborts.
#
# Fp == BLS12-381 scalar field (ark_bls12_381::Fr).
# Fr == Bandersnatch scalar field (ark_ed_on_bls12_381_bandersnatch::Fr).

[dependencies]
ark-bls12-381 = { version = "0.5", default-features = false }
ark-ed-on-bls12-381-bandersnatch = { version = "0.5", default-features = false }
ark-ff = { version = "0.5", default-features = false }
ark-serialize = { version = "0.5", default-features = false }

[[bin]]
name = "ark_oracle"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = false
codegen-units = 1
